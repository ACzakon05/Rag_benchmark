# ======================================================================
# RAG Benchmark & Playground — orkiestracja lokalnego srodowiska.
# Uwaga: Ollama uruchamiana jest zwykle na hoscie (dostep do GPU).
# Kontenery komunikuja sie z nia przez host.docker.internal.
# ======================================================================
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
        - action: sync+restart
          path: ./backend/migrations
          target: /app/migrations
        - action: sync
          path: ./backend/scripts
          target: /app/scripts
        - action: rebuild
          path: ./backend/uv.lock

  worker:
    build: ./backend
    command: scripts/start/worker.sh
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./backend/app
          target: /app/app
        - action: sync
          path: ./backend/scripts
          target: /app/scripts
        - action: rebuild
          path: ./backend/uv.lock

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    # command: npm run dev -- --host

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USER:-rag}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rag}
      POSTGRES_DB: ${DB_NAME:-rag_benchmark}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Ollama — opcjonalnie w kontenerze. Domyslnie uruchamiana na hoscie,
  # aby miec bezposredni dostep do GPU. Odkomentuj w razie potrzeby.
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./ollama_data:/root/.ollama

volumes:
  pgdata:
