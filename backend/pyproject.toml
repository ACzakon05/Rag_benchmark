[project]
name = "rag-benchmark-backend"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "fastapi[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pgvector",
    "celery[redis]",
    "python-multipart",
    "httpx",
    "rank-bm25",
    "sentence-transformers",
    "pypdf",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "testcontainers[postgres]",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["I", "F", "E", "W", "B", "UP", "SIM", "FAST"]

[tool.pytest.ini_options]
testpaths = ["tests"]
