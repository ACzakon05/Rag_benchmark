[project]
name = "rag-benchmark-backend"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "fastapi[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pgvector",
    "celery[redis]",
    "python-multipart",
    "httpx",
    "rank-bm25",
    "sentence-transformers",
    "torch",
    "pypdf",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "testcontainers[postgres]",
    "ruff",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["I", "F", "E", "W", "B", "UP", "SIM", "FAST"]

[tool.pytest.ini_options]
testpaths = ["tests"]
