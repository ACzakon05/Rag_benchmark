[project]
name = "rag-benchmark-backend"
version = "0.1.0"
description = "Backend API & orchestrator dla RAG Benchmark & Playground"
requires-python = ">=3.11"

# Zaleznosci sa tu zadeklarowane jako kontrakt techniczny (stack z sekcji 5
# specyfikacji). Wersje do doprecyzowania na Etapie 1.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlmodel",
    "python-multipart",   # upload plikow
    "httpx",              # klient Ollama / OpenAI-compatible
    "qdrant-client",
    "rank-bm25",
    "sentence-transformers",  # reranker bge
    "pypdf",              # ekstrakcja tekstu z PDF
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
